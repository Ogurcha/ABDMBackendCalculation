  stage: build_and_test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - |
      printf '%s\n' \
        'Types: deb' \
        "URIs: ${DEBIAN_MIRROR}" \
        'Suites: bookworm bookworm-updates' \
        'Components: main' \
        'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' \
        '' \
        'Types: deb' \
        "URIs: ${DEBIAN_SECURITY_MIRROR}" \
        'Suites: bookworm-security' \
        'Components: main' \
        'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' \
        > /etc/apt/sources.list.d/debian.sources

      apt-get update \
        -o Acquire::Retries=5 \
        -o Acquire::http::Timeout=30 \
        -o APT::Update::Error-Mode=any

      apt-get install -y --no-install-recommends libxml2 locales fontconfig libharfbuzz0b libfreetype6 libgdiplus libc6-dev
    - dotnet tool install --global dotnet-coverage --version 17.10.4
    - dotnet nuget add source "https://gitlab.norddig.ru/api/v4/projects/72/packages/nuget/index.json" --name CommonKafkaIntegrationMessageBroker --username $REGISTRY_LOGIN --password $REGISTRY_TOKEN --store-password-in-clear-text
    - dotnet restore Abdm.Calculation.WebApi/Abdm.Calculation.WebApi.csproj
  script:
    - |
      sed -i -e 's/# ru_RU.UTF-8 UTF-8/ru_RU.UTF-8 UTF-8/' /etc/locale.gen
      dpkg-reconfigure --frontend=noninteractive locales
      update-locale LANG=ru_RU.UTF-8

      export LANG=ru_RU.UTF-8
      export PATH="$PATH:$HOME/.dotnet/tools"

      dotnet build Abdm.Calculation.WebApi/Abdm.Calculation.WebApi.csproj --no-restore -c Release
      dotnet publish Abdm.Calculation.WebApi/Abdm.Calculation.WebApi.csproj --no-build -c Release --output ./WebAPI
  artifacts:
    paths:
      - ./**/*test-result.xml
      - Cobertura.coverage.xml
      - ./WebAPI/
      - ./forCI.Dockerfile
    reports:
      junit:
        - ./**/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: Cobertura.coverage.xml
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH

build_docker_image:master:
  image: docker:latest
  stage: publish_docker
  services:
    - name: docker:dind
      alias: docker
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t $IMAGE_NAME -f forCI.Dockerfile .
    - docker push $IMAGE_NAME
  after_script:
    - docker image rm $IMAGE_NAME
  dependencies:
    - build_back:master
  needs:
    - build_back:master
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

build_docker_image:branch:
  image: docker:latest
  stage: publish_docker
  services:
    - name: docker:dind
      alias: docker
  variables:
    GIT_STRATEGY: none
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --pull -t registry.norddig.ru/abdm/abdm_backend_calculation:$TARGET_BRANCH -f forCI.Dockerfile .
    - docker push registry.norddig.ru/abdm/abdm_backend_calculation:$TARGET_BRANCH
  after_script:
    - docker image rm registry.norddig.ru/abdm/abdm_backend_calculation:$TARGET_BRANCH
  dependencies:
    - build_back:branch
  needs:
    - build_back:branch
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH

deploy:stage:
  stage: deploy
  variables:
    GIT_STRATEGY: none
    SERVICE_NAME: "abdm-reports"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd /opt/$SERVICE_NAME
  script:
    - docker compose pull back-calculation
    - docker compose up -d
  cache: []
  dependencies:
    - build_docker_image:branch
  needs:
    - build_docker_image:branch
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH
  tags:
    - abdm-reports
    - deploy

deploy:83:
  stage: deploy
  variables:
    GIT_STRATEGY: none
    SERVICE_NAME: "abdm-reports"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd /opt/$SERVICE_NAME
  script:
    - docker compose pull back-calculation
    - docker compose up -d
  cache: []
  dependencies:
    - build_docker_image:master
  needs:
    - build_docker_image:master
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
  tags:
    - abdm-83
    - deploy